<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CHEMICONSULT - Presentación</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="slider-container">
    <section class="slide active">Bienvenidos a CHEMICONSULT</section>
    <section class="slide">Nuestros Servicios</section>
    <section class="slide">Contacto</section>
  </div>

  <nav class="controls">
    <button data-slide="0">Inicio</button>
    <button data-slide="1">Servicios</button>
    <button data-slide="2">Contacto</button>
  </nav>

  <script>
    const container = document.querySelector('.slider-container');
    document.querySelectorAll('[data-slide]').forEach(button => {
      button.addEventListener('click', () => {
        const slideIndex = button.getAttribute('data-slide');
        container.style.transform = `translateX(-${slideIndex * 100}vw)`;
      });
    });
  </script>
</body>
</html>
