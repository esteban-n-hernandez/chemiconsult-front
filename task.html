<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Tareas | Chemiconsult</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="css/task/task.css">
</head>
<body>

<!-- SIDEBAR -->
<div id="sidebar-container"></div>

<!-- CONTENIDO PRINCIPAL -->
<div class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="page-title m-0">Tareas</h3>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#taskModal">+ Nueva tarea</button>
    </div>

    <div class="row g-3">
        <!-- Columna Pendiente -->
        <div class="col-12 col-lg-4">
            <div class="kanban-col" data-status="TODO">
                <div class="kanban-header">
                    <h6 class="m-0">Pendiente</h6>
                    <span class="badge" id="count-todo">1</span>
                </div>
                <div id="col-todo" class="dropzone">

                    <!-- Tarjeta Hardcodeada de Ejemplo con Usuario -->
                    <div class="kanban-card todo">
                        <div class="kanban-card-body">
                            <h5 class="kanban-card-title">Análisis de aguas residuales</h5>
                            <p class="kanban-card-desc">Revisión de parámetros microbiológicos según la resolución 241.</p>
                        </div>
                        <div class="kanban-card-footer">
                            <div class="kanban-card-actions">
                                <button class="btn btn-link-danger p-0" title="Eliminar"><i class="bi bi-trash3"></i></button>
                            </div>
                            <div class="task-creator" title="Creado por: Carlos Mendoza">
                                <span class="creator-avatar">CM</span>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>

        <!-- Columna En Progreso -->
        <div class="col-12 col-lg-4">
            <div class="kanban-col" data-status="IN_PROGRESS">
                <div class="kanban-header">
                    <h6 class="m-0">En progreso</h6>
                    <span class="badge" id="count-inprogress">0</span>
                </div>
                <div id="col-inprogress" class="dropzone"></div>
            </div>
        </div>

        <!-- Columna Finalizadas -->
        <div class="col-12 col-lg-4">
            <div class="kanban-col" data-status="DONE">
                <div class="kanban-header">
                    <h6 class="m-0">Finalizadas</h6>
                    <span class="badge" id="count-done">0</span>
                </div>
                <div id="col-done" class="dropzone"></div>
            </div>
        </div>
    </div>
</div>

<!-- Modal nueva tarea -->
<div class="modal fade" id="taskModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <form class="modal-content" id="taskForm">
            <div class="modal-header">
                <h5 class="modal-title">Nueva tarea</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label">Título</label>
                    <input type="text" class="form-control" id="title" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Descripción</label>
                    <textarea class="form-control" id="description" rows="3"></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label">Estado inicial</label>
                    <select class="form-select" id="status">
                        <option value="TODO">Pendiente</option>
                        <option value="IN_PROGRESS">En progreso</option>
                        <option value="DONE">Finalizada</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline-secondary" type="button" data-bs-dismiss="modal">Cancelar</button>
                <button class="btn btn-primary" type="submit">Guardar</button>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/task.js"></script>
<script src="js/sidebar.js"></script>
</body>
</html>
