<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudios - CHEMICONSULT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', sans-serif;
        }

        .sidebar {
            height: 100vh;
            background-color: #5EA504;
            color: white;
            padding-top: 20px;
            position: fixed;
            width: 220px;
        }

        .sidebar a {
            color: white;
            display: block;
            padding: 10px 20px;
            text-decoration: none;
            font-weight: 500;
        }

        .sidebar a:hover {
            background-color: #7cd832;
        }

        .content {
            margin-left: 240px;
            padding: 20px;
        }

        .btn-icon {
            border: none;
            background: none;
            color: #5EA504;
            cursor: pointer;
        }

        .btn-icon:hover {
            color: #7cd832;
        }
    </style>
</head>
<body>
<div class="sidebar">
    <h4 class="text-center">CHEMICONSULT</h4>
    <hr class="text-white">
    <a href="dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
    <a href="estudios.html"><i class="bi bi-flask"></i> Estudios</a>
    <a href="#" id="logout"><i class="bi bi-box-arrow-right"></i> Cerrar sesión</a>
</div>

<div class="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Listado de Estudios</h2>
        <div>
            <input type="text" id="searchId" class="form-control d-inline-block" style="width: 200px;"
                   placeholder="Buscar por ID">
            <button class="btn btn-success ms-2" onclick="buscarPorId()">Buscar</button>
        </div>
    </div>

    <table class="table table-bordered table-striped align-middle">
        <thead class="table-success">
        <tr>
            <th>ID</th>
            <th>Tipo</th>
            <th>Fecha</th>
            <th>Estado</th>
            <th class="text-center">Ver resultado</th>
        </tr>
        </thead>
        <tbody id="tablaEstudios">
        <tr>
            <td colspan="5" class="text-center">Cargando estudios...</td>
        </tr>
        </tbody>
    </table>
</div>

<!-- 🧩 MODAL PARA VER DETALLE -->
<div class="modal fade" id="detalleModal" tabindex="-1" aria-labelledby="detalleModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header bg-success text-white">
                <h5 class="modal-title" id="detalleModalLabel">Detalle del Estudio</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Cerrar"></button>
            </div>
            <div class="modal-body" id="detalleContenido">
                <p>Cargando...</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const token = localStorage.getItem("token");

    if (!token) {
        window.location.href = "index.html";
    }

    async function cargarEstudios() {
        try {
            const response = await fetch("https://chemiconsult.onrender.com/api/estudios", {
                method: "GET",
                headers: {
                    "Authorization": "Bearer " + token
                }
            });

            if (!response.ok) {
                throw new Error("Error al cargar estudios");
            }

            const estudios = await response.json();
            mostrarEstudios(estudios);

        } catch (error) {
            console.error("Error:", error);
            document.getElementById("tablaEstudios").innerHTML =
                `<tr><td colspan="5" class="text-center text-danger">Error al cargar los estudios</td></tr>`;
        }
    }

    function mostrarEstudios(estudios) {
        const tabla = document.getElementById("tablaEstudios");
        tabla.innerHTML = "";

        if (estudios.length === 0) {
            tabla.innerHTML = `<tr><td colspan="5" class="text-center">No hay estudios disponibles</td></tr>`;
            return;
        }

        estudios.forEach(estudio => {
            const botonVer = estudio.estado?.toLowerCase() === "completado" || estudio.estado?.toLowerCase() === "completo"
                ? `<button class="btn-icon" onclick="verDetalle(${estudio.id})"><i class="bi bi-search"></i></button>`
                : `<span class="text-muted">—</span>`;

            const row = `
                <tr>
                    <td>${estudio.id}</td>
                    <td>${estudio.tipo || "-"}</td>
                    <td>${estudio.date || "-"}</td>
                    <td>${estudio.estado || "-"}</td>
                    <td class="text-center">${botonVer}</td>
                </tr>`;
            tabla.innerHTML += row;
        });
    }

    async function buscarPorId() {
        const id = document.getElementById("searchId").value.trim();
        if (!id) return cargarEstudios();

        try {
            const response = await fetch(`https://chemiconsult.onrender.com/api/estudios/${id}`, {
                method: "GET",
                headers: {
                    "Authorization": "Bearer " + token
                }
            });

            if (!response.ok) throw new Error("Estudio no encontrado");

            const estudio = await response.json();
            mostrarEstudios([estudio]);

        } catch (error) {
            console.error(error);
            document.getElementById("tablaEstudios").innerHTML =
                `<tr><td colspan="5" class="text-center text-danger">Estudio no encontrado</td></tr>`;
        }
    }

    async function verDetalle(id) {
        try {
            const response = await fetch(`https://chemiconsult.onrender.com/api/estudios/${id}/resultado`, {
                method: "GET",
                headers: {
                    "Authorization": "Bearer " + token
                }
            });

            if (!response.ok) throw new Error("No se pudo obtener el resultado");

            // Obtener el PDF como blob
            const blob = await response.blob();

            // Crear una URL temporal del PDF para mostrar en el iframe
            const url = URL.createObjectURL(blob);
            document.getElementById("pdfViewer").src = url;

            // Abrir el modal
            const modal = new bootstrap.Modal(document.getElementById('pdfModal'));
            modal.show();

        } catch (error) {
            console.error(error);
            alert("Error al obtener el resultado del estudio.");
        }
    }


    document.getElementById("logout").addEventListener("click", () => {
        localStorage.removeItem("token");
        window.location.href = "index.html";
    });

    cargarEstudios();
</script>

<!-- Modal para visualizar PDF -->
<div class="modal fade" id="pdfModal" tabindex="-1" aria-labelledby="pdfModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-xl">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="pdfModalLabel">Resultado del Estudio</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <div class="modal-body">
                <iframe id="pdfViewer" src="" width="100%" height="600px" style="border:none;"></iframe>
            </div>
        </div>
    </div>
</div>

</body>
</html>
