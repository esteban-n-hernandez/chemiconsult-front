<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Mi Perfil - CHEMICONSULT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet"/>
    <link rel="stylesheet" href="css/sidebar.css"/>
    <link rel="stylesheet" href="css/perfil/perfil.css"/>
</head>
<body>

<!-- SIDEBAR -->
<div id="sidebar-container"></div>

<!-- CONTENIDO -->
<div class="content">
    <div class="page-header">
        <div>
            <h1>Mi Perfil</h1>
            <p id="fecha-hoy"></p>
        </div>
        <div class="header-user">
            <div class="header-user-info">
                <p class="header-user-name" id="header-nombre">—</p>
                <p class="header-user-role" id="header-rol">—</p>
            </div>
            <div class="avatar-circle" id="header-avatar">--</div>
        </div>
    </div>

    <!-- Panel: Datos de cuenta -->
    <div class="panel">
        <div class="panel-header">
            <h5><i class="bi bi-person-vcard me-2 panel-title-icon-green"></i>Datos de cuenta</h5>
        </div>
        <div class="panel-body">
            <div id="perfilLoading" class="text-center text-muted py-4">
                <span class="spinner-border spinner-border-sm me-2"></span> Cargando datos...
            </div>

            <form id="formDatosCuenta" class="d-none" novalidate>
                <div class="form-row">
                    <div class="form-group">
                        <label>Nombre de usuario <span class="required">*</span></label>
                        <input type="text" id="inputUsername" class="form-control-custom" autocomplete="off"/>
                        <span class="field-error" id="errUsername">Campo requerido</span>
                    </div>
                    <div class="form-group">
                        <label>Email <span class="required">*</span></label>
                        <input type="email" id="inputEmail" class="form-control-custom" autocomplete="off"/>
                        <span class="field-error" id="errEmail">Ingresá un email válido</span>
                    </div>
                    <div class="form-group">
                        <label>Rol</label>
                        <input type="text" id="inputRol" class="form-control-custom" disabled/>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-guardar" id="btnGuardarDatos">
                        <i class="bi bi-check-lg"></i> Guardar cambios
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Panel: Cambiar contraseña -->
    <div class="panel">
        <div class="panel-header">
            <h5><i class="bi bi-shield-lock me-2 panel-title-icon-green"></i>Cambiar contraseña</h5>
        </div>
        <div class="panel-body">
            <form id="formPassword" novalidate>
                <div class="form-row">
                    <div class="form-group">
                        <label>Contraseña actual <span class="required">*</span></label>
                        <input type="password" id="inputPasswordActual" class="form-control-custom" autocomplete="current-password"/>
                        <span class="field-error" id="errPasswordActual">Campo requerido</span>
                    </div>
                    <div class="form-group">
                        <label>Contraseña nueva <span class="required">*</span></label>
                        <input type="password" id="inputPasswordNueva" class="form-control-custom" autocomplete="new-password"/>
                        <span class="field-error" id="errPasswordNueva">Mínimo 6 caracteres</span>
                    </div>
                    <div class="form-group">
                        <label>Confirmar contraseña nueva <span class="required">*</span></label>
                        <input type="password" id="inputPasswordConfirmar" class="form-control-custom" autocomplete="new-password"/>
                        <span class="field-error" id="errPasswordConfirmar">Las contraseñas no coinciden</span>
                    </div>
                </div>

                <!-- Mensaje de error del servidor (ej: contraseña actual incorrecta) -->
                <div class="alert alert-danger d-none" id="passwordErrorServidor"></div>

                <div class="form-actions">
                    <button type="submit" class="btn-guardar" id="btnCambiarPassword">
                        <i class="bi bi-shield-check"></i> Cambiar contraseña
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Toast de confirmación -->
<div class="toast-confirm" id="toastConfirm">
    <i class="bi bi-check-circle-fill"></i>
    <span id="toastMsg">Operación realizada correctamente</span>
</div>

<script src="js/sidebar.js"></script>
<script src="js/perfil.js"></script>
</body>
</html>
