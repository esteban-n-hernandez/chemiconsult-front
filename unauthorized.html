<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Acceso denegado - CHEMICONSULT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet"/>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: system-ui, -apple-system, sans-serif;
        }

        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            padding: 3rem 2.5rem;
            max-width: 420px;
            width: 100%;
            text-align: center;
        }

        .icon-wrap {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: #fef2f2;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
        }

        .icon-wrap i {
            font-size: 2rem;
            color: #ef4444;
        }

        .brand {
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            color: #5EA504;
            text-transform: uppercase;
            margin-bottom: 1rem;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #111827;
            margin-bottom: 0.5rem;
        }

        p {
            color: #6b7280;
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 2rem;
        }

        .btn-primary {
            display: inline-block;
            background: #5EA504;
            color: white;
            text-decoration: none;
            padding: 0.65rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        .btn-primary:hover { background: #4d8a03; color: white; }

        .btn-secondary {
            display: inline-block;
            color: #6b7280;
            text-decoration: none;
            padding: 0.65rem 1.5rem;
            border-radius: 8px;
            font-weight: 500;
            font-size: 0.9rem;
            margin-left: 0.5rem;
            transition: color 0.2s;
        }

        .btn-secondary:hover { color: #374151; }
    </style>
</head>
<body>
<div class="card">
    <p class="brand">CHEMICONSULT</p>

    <div class="icon-wrap">
        <i class="bi bi-shield-lock-fill"></i>
    </div>

    <h1>Acceso denegado</h1>
    <p>No tenés permiso para ver esta página.<br>Si creés que esto es un error, contactá al administrador.</p>

    <div>
        <a href="#" id="btn-dashboard" class="btn-primary">
            <i class="bi bi-house-fill"></i> Ir al dashboard
        </a>
        <a href="login.html" id="btn-logout" class="btn-secondary">Cerrar sesión</a>
    </div>
</div>

<script>
    const role = (localStorage.getItem('userRole') || '').toUpperCase();
    const dashboard = role === 'ROLE_CLIENTE' ? 'dashboard-cliente.html' : 'dashboard-empleado.html';
    document.getElementById('btn-dashboard').href = dashboard;

    document.getElementById('btn-logout').addEventListener('click', function(e) {
        e.preventDefault();
        ['token', 'userEmail', 'userRole', 'userId', 'userName'].forEach(k => localStorage.removeItem(k));
        window.location.href = 'login.html';
    });
</script>
</body>
</html>
