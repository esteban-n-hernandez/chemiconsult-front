<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CHEMICONSULT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-container {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 100%;
        }

        .login-container h2 {
            color: #5EA504;
            margin-bottom: 1.5rem;
        }

        .btn-login {
            background-color: #5EA504;
            color: white;
            border: none;
            width: 100%;
            transition: background-color 0.3s ease;
        }

        .btn-login:hover {
            background-color: #7cd832;
        }
    </style>
</head>
<body>
<div class="login-container text-center">
    <img src="img/Logo transparente.png" alt="CHEMICONSULT" class="img-fluid mb-3" style="max-height: 80px;">
    <h2>Iniciar Sesión</h2>

    <form id="loginForm">
        <div class="mb-3 text-start">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" required>
        </div>

        <div class="mb-3 text-start">
            <label for="password" class="form-label">Contraseña</label>
            <input type="password" class="form-control" id="password" required>
        </div>

        <button type="submit" class="btn btn-login mt-2">Ingresar</button>

        <p id="error-message" class="text-danger mt-3" style="display: none;">Usuario o contraseña incorrectos</p>
    </form>
</div>

<script>
    document.getElementById("loginForm").addEventListener("submit", async function (e) {
        e.preventDefault();

        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        const formBody = new URLSearchParams();
        formBody.append("email", email);
        formBody.append("password", password);

        try {
            const response = await fetch("https://chemiconsult.onrender.com/login", {
                method: "POST",
                headers: {"Content-Type": "application/x-www-form-urlencoded"},
                body: formBody
            });

            if (response.ok) {
                // 🔍 Leer el cuerpo como JSON
                const data = await response.json();

console.log("✅ Respuesta completa:", data);
                
                //  Mostrar el token en consola (solo para pruebas)
                console.log("✅ Token recibido:", data.token);

                // Guardar token y email en localStorage
                localStorage.setItem("token", data.token);
                localStorage.setItem("userEmail", email);

                // 👉 Redirigir al dashboard
                window.location.href = "dashboard.html";
            } else {
                document.getElementById("error-message").style.display = "block";
            }
        } catch (error) {
            console.error("Error de conexión:", error);
            document.getElementById("error-message").style.display = "block";
        }
    });
</script>


</body>
</html>
